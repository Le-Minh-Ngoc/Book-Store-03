{% extends 'base/base.html' %}

{% block title %}Đăng nhập - BookStore{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 50px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: #667eea;">Đăng nhập</h2>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Đăng nhập
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #666;">
            Chưa có tài khoản? <a href="{% url 'register' %}" style="color: #667eea; font-weight: 600;">Đăng ký ngay</a>
        </p>
    </div>
</div>
{% endblock %}
