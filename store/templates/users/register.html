{% extends 'base/base.html' %}

{% block title %}Đăng ký - BookStore{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; color: #667eea;">Đăng ký tài khoản</h2>

        <form method="POST" action="{% url 'register' %}" id="registerForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" name="fullname" class="form-control">
            </div>

            <div class="form-group">
                <label for="tel">Số điện thoại</label>
                <input type="tel" id="tel" name="tel" class="form-control">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                Đăng ký
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #666;">
            Đã có tài khoản? <a href="{% url 'login' %}" style="color: #667eea; font-weight: 600;">Đăng nhập ngay</a>
        </p>
    </div>
</div>
{% endblock %}
