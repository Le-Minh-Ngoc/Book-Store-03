{% extends 'base/base.html' %}

{% block title %}Tác giả - BookStore{% endblock %}

{% block content %}
<div style="margin: 30px 0;">
    <h1 style="text-align: center; margin-bottom: 2rem; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
        Các tác giả
    </h1>

    <div class="grid grid-4">
        {% for author in authors %}
        <a href="{% url 'author_detail' author.id %}" style="text-decoration: none;">
            <div class="card" style="text-align: center; cursor: pointer;">
                <div
                    style="width: 120px; height: 120px; margin: 0 auto 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; font-weight: bold;">
                    {{ author.name|slice:":1" }}
                </div>
                <h3 style="color: #333; margin-bottom: 0.5rem;">{{ author.name }}</h3>
                <p style="color: #666; font-size: 0.9rem;">{{ author.country }}</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
