{% extends 'base/base.html' %}

{% block title %}Thể loại sách - BookStore{% endblock %}

{% block content %}
<div style="margin: 30px 0;">
    <h1 style="text-align: center; margin-bottom: 3rem; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
        Thể loại sách
    </h1>

    <div
        style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; padding: 0 2rem;">
        {% for category in categories %}
        <a href="{% url 'book_list' %}?category={{ category.type }}" style="text-decoration: none; 
                  background: rgba(255, 255, 255, 0.95);
                  padding: 12px 28px;
                  border-radius: 50px;
                  color: #667eea;
                  font-weight: 700;
                  font-size: 1.05rem;
                  transition: all 0.3s ease;
                  display: inline-block;
                  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);"
            onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 8px 25px rgba(102, 126, 234, 0.3)'; this.style.background='linear-gradient(135deg, #667eea 0%, #764ba2 100%)'; this.style.color='white';"
            onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(0, 0, 0, 0.08)'; this.style.background='rgba(255, 255, 255, 0.95)'; this.style.color='#667eea';">
            {{ category.type }}
        </a>
        {% empty %}
        <p style="color: white; text-align: center; width: 100%;">Chưa có thể loại nào.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
